name: "DeepSeek 余额"
description: "官方余额 + 充值/赠送 + 峰/谷计价（holy-max，无曲线）"
author: "holy-max"
homepage: "https://github.com/holy-max/egern-deepseek-balance"
icon: "brain.head.profile"

env_schema:
  API_KEY:
    name: API Key
    description: "platform.deepseek.com 创建的 sk-… Key，只保存在本机模块 Env，不会进仓库"
    default_value: ""
  warn_cny:
    name: 告警阈值
    description: "余额低于该值时变黄/告警色（默认 10，单位与 currency 一致）"
    default_value: "10"
  currency:
    name: 币种偏好
    description: "优先 CNY 或 USD；留空则选总额更大的池"
    default_value: "CNY"
  title:
    name: 标题
    description: "小组件标题"
    default_value: "DeepSeek"

scriptings:
- generic:
    name: DeepSeek 余额
    script_url: https://raw.githubusercontent.com/holy-max/egern-deepseek-balance/main/deepseek-balance.js?v=ui3
    timeout: 15
    update_interval: 300

widgets:
- name: DeepSeek 余额
  script_name: DeepSeek 余额
